<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🌸 You found an easter egg!</title>
<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Trebuchet MS", sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #ffd6ec 0%, transparent 45%),
      radial-gradient(circle at 80% 30%, #ffe3f3 0%, transparent 40%),
      linear-gradient(135deg, #ffb6d9, #ff9ecf, #c69cf0, #ffb6d9);
    color: #8a2a64;
  }
  .banner { text-align: center; padding: 28px 20px 18px; }
  .banner h1 { margin: 0 0 6px; font-size: 28px; font-weight: 800; letter-spacing: 0.5px; }
  .banner p { margin: 0; font-size: 16px; opacity: 0.9; }
  .game-wrap { display: flex; justify-content: center; padding: 0 12px 28px; }
  iframe {
    width: 100%; max-width: 600px; height: 780px;
    border: 0; border-radius: 20px;
    box-shadow: 0 12px 40px rgba(180, 40, 120, 0.25);
    background: #fff;
  }
</style>
</head>
<body>
  <div class="banner">
    <h1>🌸 You found an easter egg! 🌸</h1>
    <p>Congratulations and have fun!</p>
  </div>
  <div class="game-wrap">
    <iframe src="snake.html" allow="autoplay" title="Blossom Snake"></iframe>
  </div>
</body>
</html>
